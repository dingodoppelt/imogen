name: Linux LV2 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lv2:
    name: Build Imogen LV2 on Ubuntu
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libjack-jackd2-dev \
            libwebkit2gtk-4.0-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            ladspa-sdk \
            mesa-common-dev

      - name: Configure CMake for LV2
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLEMONS_PLUGIN_FORMATS=LV2
          -DLEMONS_JUCE_BRANCH=develop

      - name: Build LV2 plugin
        run: cmake --build build --config Release --parallel 2

      - name: Verify LV2 bundle
        run: |
          test -d build/Imogen_artefacts/Release/LV2/Imogen.lv2
          find build/Imogen_artefacts/Release/LV2/Imogen.lv2 -maxdepth 2 -type f -print

      - name: Upload LV2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Imogen-LV2-linux
          path: build/Imogen_artefacts/Release/LV2/Imogen.lv2/
          if-no-files-found: error
